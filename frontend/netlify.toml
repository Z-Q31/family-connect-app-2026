[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API 请求转发到 Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA 路由: 非 API 请求返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200